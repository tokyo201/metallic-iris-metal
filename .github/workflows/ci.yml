name: Build test mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Build mod JAR
        run: gradle build --no-daemon

      - name: Show packaged fabric.mod.json
        run: |
          ls -1 build/libs
          unzip -p build/libs/metallic-iris-metal-0.1.0.jar fabric.mod.json

      - name: Publish jar to the rolling latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=build/libs/metallic-iris-metal-0.1.0.jar
          NOTES="Rolling build of main at ${GITHUB_SHA::7}. Replaced on every push."
          if gh release view latest-build >/dev/null 2>&1; then
            gh release edit latest-build --notes "$NOTES"
          else
            gh release create latest-build --prerelease --target "$GITHUB_SHA" \
              --title "Latest build" --notes "$NOTES"
          fi
          gh release upload latest-build "$JAR" --clobber

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: metallic-iris-metal-test-jar
          path: build/libs/metallic-iris-metal-0.1.0.jar
          if-no-files-found: error
