name: Inspect Minecraft API (manual)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Populate Loom cache
        run: gradle compileJava --no-daemon -q
      - name: Dump renderer API
        run: |
          JAR=""
          for j in $(find "$HOME/.gradle" "$PWD/.gradle" -name '*.jar' -size +5M 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/renderer/GameRenderer.class'; then JAR="$j"; break; fi
          done
          echo "JAR=$JAR"
          for c in net.minecraft.client.renderer.GameRenderer net.minecraft.client.renderer.LevelRenderer net.minecraft.client.gui.Gui net.minecraft.client.gui.GuiGraphicsExtractor; do
            echo "##### $c"
            javap -p -cp "$JAR" "$c" 2>&1 | grep -E "^(public |final |abstract )?(class|interface)|void (render|extract|fill|draw)[A-Za-z]*\(|(render|extract|fill|draw|blit)[A-Za-z]*\(.*\)" | cut -c1-210 | head -45
          done
          echo "##### Minecraft.renderFrame/runTick"
          javap -p -cp "$JAR" net.minecraft.client.Minecraft | grep -E "renderFrame|runTick|gameRenderer|getMainRenderTarget" | cut -c1-200
          echo "##### mixin on classpath?"
          find "$HOME/.gradle" -name 'sponge-mixin*.jar' | head -2
