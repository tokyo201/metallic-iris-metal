name: Inspect Minecraft API (manual)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Populate Loom cache
        run: gradle compileJava --no-daemon -q
      - name: Dump Fabric HUD API
        run: |
          for J in $(find "$HOME/.gradle" -name 'fabric-rendering-v1*.jar' ! -name '*sources*' | head -2); do echo "JAR=$J"; done
          J=$(find "$HOME/.gradle" -name 'fabric-rendering-v1*.jar' ! -name '*sources*' | head -1)
          echo "##### HUD classes in jar"
          unzip -l "$J" | awk '{print $4}' | grep -E "client/rendering/v1/hud/[A-Za-z]+\.class$" | head -20
          for c in net.fabricmc.fabric.api.client.rendering.v1.hud.HudElementRegistry net.fabricmc.fabric.api.client.rendering.v1.hud.HudElement net.fabricmc.fabric.api.client.rendering.v1.hud.VanillaHudElements; do
            echo "##### $c"; javap -p -cp "$J" "$c" 2>&1 | cut -c1-200 | head -30
          done
