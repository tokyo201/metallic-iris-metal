name: Inspect Minecraft API (manual)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Populate Loom cache
        run: gradle compileJava --no-daemon -q
      - name: Dump resource injection and uniform APIs
        run: |
          MC=$(find "$HOME/.gradle" -name 'minecraft-merged.jar' | head -1)
          echo "##### fabric resource loader jars"
          find "$HOME/.gradle" -name 'fabric-resource-loader*.jar' ! -name '*sources*' | head -3
          RL=$(find "$HOME/.gradle" -name 'fabric-resource-loader*.jar' ! -name '*sources*' | head -1)
          unzip -l "$RL" | awk '{print $4}' | grep -E "api/.*\\.class" | head -30
          for c in $(unzip -l "$RL" | awk '{print $4}' | grep -E "api/resource/v1/(ResourceLoader|pack/PackActivationType|ResourcePackBuilder)\\.class" | sed 's/\\.class//;s#/#.#g'); do echo "--- $c"; javap -p -cp "$RL" "$c" | cut -c1-220; done
          echo "##### PostChain / PostPass / ShaderManager"
          for c in PostChain PostPass ShaderManager; do javap -p -cp "$MC" net.minecraft.client.renderer.$c | cut -c1-220; done
          echo "##### post effect JSON codec classes"
          unzip -l "$MC" | awk '{print $4}' | grep -iE "PostChainConfig" | head
          javap -p -cp "$MC" 'net.minecraft.client.renderer.PostChainConfig$Pass' 2>&1 | head -20 | cut -c1-200
          echo "##### CommandEncoder / PostPass uniform write"
          javap -p -cp "$MC" com.mojang.blaze3d.systems.CommandEncoder | grep -E "writeToBuffer|mapBuffer" | cut -c1-220
