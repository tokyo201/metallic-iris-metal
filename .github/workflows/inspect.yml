name: Inspect Minecraft API (manual)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Populate Loom cache
        run: gradle compileJava --no-daemon -q
      - name: Dump post-effect system
        run: |
          MC=$(find "$HOME/.gradle" -name 'minecraft-merged.jar' | head -1)
          LC=$(find "$HOME/.gradle" -name 'fabric-lifecycle-events-v1*.jar' ! -name '*sources*' | head -1)
          echo "##### post_effect + shader files"
          unzip -l "$MC" | awk '{print $4}' | grep -E "assets/minecraft/(post_effect|shaders/post)/|core/screenquad" | head -30
          for f in assets/minecraft/post_effect/invert.json assets/minecraft/shaders/post/invert.fsh assets/minecraft/shaders/core/screenquad.vsh; do echo "--- $f"; unzip -p "$MC" "$f" 2>&1 | head -40; done
          echo "##### GameRenderer post/effect methods"
          javap -p -cp "$MC" net.minecraft.client.renderer.GameRenderer | grep -iE "post|effect|shader" | cut -c1-200
          echo "##### ShaderManager / PostChain"
          javap -p -cp "$MC" net.minecraft.client.renderer.ShaderManager | grep -iE "post|public" | cut -c1-200 | head -15
          javap -p -cp "$MC" net.minecraft.client.renderer.PostChain | grep -E "public|static" | cut -c1-200 | head -12
          echo "##### Minecraft getShaderManager"
          javap -p -cp "$MC" net.minecraft.client.Minecraft | grep -iE "ShaderManager|getMainRenderTarget" | cut -c1-160
          echo "##### ClientTickEvents"
          javap -p -cp "$LC" net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents 2>&1 | head -8 | cut -c1-200
          echo "##### vanilla post effect ids"
          javap -p -cp "$MC" net.minecraft.client.renderer.LevelTargetBundle 2>&1 | grep -E "Identifier|public" | head -12 | cut -c1-160
