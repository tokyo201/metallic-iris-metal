name: Inspect Minecraft API (manual)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Populate Loom cache
        run: gradle compileJava --no-daemon -q
      - name: Dump injection APIs v2
        run: |
          MC=$(find "$HOME/.gradle" -name 'minecraft-merged.jar' | head -1)
          RL=$(find "$HOME/.gradle" -path '*fabric-resource-loader-v1*' -name '*.jar' ! -name '*sources*' | head -1)
          for c in net.fabricmc.fabric.api.resource.v1.ResourceLoader net.fabricmc.fabric.api.resource.v1.pack.ModPackResources net.fabricmc.fabric.api.resource.v1.pack.PackActivationType net.fabricmc.fabric.api.resource.v1.DataResourceLoader; do echo "--- $c"; javap -p -cp "$RL:$MC" "$c" | cut -c1-260; done
          for c in 'net.minecraft.client.renderer.PostPass$Input' net.minecraft.client.renderer.UniformValue 'net.minecraft.client.renderer.ShaderManager$Configs' net.minecraft.client.renderer.MappableRingBuffer net.minecraft.server.packs.resources.ResourceManager net.minecraft.server.packs.PackResources net.minecraft.server.packs.resources.IoSupplier; do echo "--- $c"; javap -p -cp "$MC" "$c" | cut -c1-260; done
          echo "--- GameRenderer"; javap -p -cp "$MC" net.minecraft.client.renderer.GameRenderer | grep -iE "postEffect|processPost|PostChain" | cut -c1-260
          echo "--- Identifier"; javap -p -cp "$MC" net.minecraft.resources.Identifier | grep -E "public" | cut -c1-200 | head -20
          echo "--- ClientPackSource/Pack"; unzip -l "$RL" | awk '{print $4}' | grep -E "\\.class" | grep -vE "mixin|impl" | head -40
