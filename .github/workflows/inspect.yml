name: Inspect Minecraft API (manual)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Populate Loom cache
        run: gradle compileJava --no-daemon -q
      - name: Dump Gui details
        run: |
          JAR=$(find "$HOME/.gradle" -name 'minecraft-merged.jar' | head -1)
          echo "JAR=$JAR"
          echo "##### Gui fields"
          javap -p -cp "$JAR" net.minecraft.client.gui.Gui | grep -E "GuiGraphicsExtractor|Minecraft minecraft|Font font|extractRenderState|extractOverlay|extractHotbar|extractCrosshair" | cut -c1-200
          echo "##### extractRenderState bytecode refs"
          javap -p -c -cp "$JAR" net.minecraft.client.gui.Gui | awk '/public void extractRenderState\(net.minecraft.client.DeltaTracker/{f=1} f&&/^$/{exit} f' | grep -E "GuiGraphicsExtractor|invoke.*Gui\.|getfield" | head -30 | cut -c1-200
          echo "##### who calls Gui.extractRenderState"
          javap -p -c -cp "$JAR" net.minecraft.client.renderer.GameRenderer | grep -E "Gui.extractRenderState|GuiGraphicsExtractor.\"<init>|GuiRenderState" | head -8 | cut -c1-200
          echo "##### Gui class members count"
          javap -p -cp "$JAR" net.minecraft.client.gui.Gui | grep -c .
