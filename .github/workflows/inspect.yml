name: Inspect Minecraft API (manual)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Populate Loom cache
        run: gradle compileJava --no-daemon -q
      - name: Dump Blaze3D API
        run: |
          MC=$(find "$HOME/.gradle" -name 'minecraft-merged.jar' | head -1)
          FR=$(find "$HOME/.gradle" -name 'fabric-rendering-v1*.jar' ! -name '*sources*' | head -1)
          show() { echo "##### $1"; javap -p -cp "$MC:$FR" "$1" 2>&1 | grep -vE "^Compiled|lambda\$|static \{\}|synthetic" | cut -c1-190 | head -${2:-40}; }
          echo "##### fabric world events"
          unzip -l "$FR" | awk '{print $4}' | grep -E "rendering/v1/world/[A-Za-z]+\.class$" | head -20
          show net.fabricmc.fabric.api.client.rendering.v1.world.WorldRenderEvents 30
          show com.mojang.blaze3d.pipeline.RenderPipeline 30
          show 'com.mojang.blaze3d.pipeline.RenderPipeline$Builder' 40
          show com.mojang.blaze3d.systems.RenderPass 30
          show com.mojang.blaze3d.systems.CommandEncoder 30
          show com.mojang.blaze3d.systems.GpuDevice 25
          show com.mojang.blaze3d.pipeline.RenderTarget 25
          show net.minecraft.client.renderer.PostPass 20
          echo "##### Minecraft getMainRenderTarget / RenderSystem getDevice"
          javap -p -cp "$MC" net.minecraft.client.Minecraft | grep -E "RenderTarget" | cut -c1-160
          javap -p -cp "$MC" com.mojang.blaze3d.systems.RenderSystem | grep -E "getDevice|getSamplerCache|sampler" | cut -c1-160
          echo "##### blit shaders"
          for f in assets/minecraft/shaders/core/blit_screen.vsh assets/minecraft/shaders/core/blit_screen.fsh assets/minecraft/shaders/post/blit.fsh; do echo "--- $f"; unzip -p "$MC" "$f" 2>&1 | head -30; done
          unzip -l "$MC" | awk '{print $4}' | grep -E "shaders/(core/blit|post/(blit|invert|entity_outline))" | head
          echo "##### RenderPipelines blit"
          javap -p -cp "$MC" net.minecraft.client.renderer.RenderPipelines | grep -iE "blit|screen" | cut -c1-170 | head
